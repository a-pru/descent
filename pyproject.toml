[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "descent"
version = "1.0.0"
description = "DESCENT: Directed Edge Scene Encoding for Airport Surface Movement Prediction"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Alexander Prutsch"},
    {name = "David Schinagl"},
    {name = "Horst Possegger"},
]
dependencies = [
    "torch>=2.4",
    "lightning==2.2.0.post0",
    "pytorch-lightning==2.2.0.post0",
    "torchmetrics>=1.3",
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "omegaconf>=2.3",
    "pyrootutils==1.0.4",
    "rich>=13.7,<14",
    "easydict==1.10",
    "numpy>=1.21,<2",
    "networkx>=3.1",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "tensorboard>=2.14",
]

[tool.setuptools.packages.find]
include = ["descent*"]

[project.urls]
Homepage = "https://a-pru.github.io/descent/"
Repository = "https://github.com/a-pru/descent"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["descent"]
